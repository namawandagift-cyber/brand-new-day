
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PayFees</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">PayFees</a>
            <a class="btn btn-outline-light" href="school.html">
                Back to School
            </a>   
        </div>
    </nav>

    <div class="container py-5">

        <div class="text-center mb-4">
            <h1 class="fw-bold">PayFees </h1>
            <p class="text-muted">
                Check student fees and outstanding balances.
            </p>
        </div>

        <!-- Fees Checker Form -->
        <div class="card shadow-sm mx-auto mb-4" style="max-width: 650px;">
            <div class="card-body p-4">

                <h4 class="mb-3">Student Details</h4>

                <form id="feesForm">

                    <div class="mb-3">
                        <label for="studentName" class="form-label">
                            Student Name
                        </label>
                        <input
                            type="text"
                            id="studentName"
                            class="form-control"
                            placeholder="Enter student name"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="studentClass" class="form-label">
                            Class Level
                        </label>
                        <select id="studentClass" class="form-select" required>
                            <option value="">Choose class level</option>
                            <option value="O-Level">O-Level</option>
                            <option value="A-Level">A-Level</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="amountPaid" class="form-label">
                            Amount Paid (UGX)
                        </label>
                        <input
                            type="number"
                            id="amountPaid"
                            class="form-control"
                            placeholder="Enter amount paid"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Check Fees
                    </button>

                </form>
            </div>
        </div>

        <!-- Results Table -->
        <div class="card shadow-sm">
            <div class="card-body">

                <h4 class="mb-3">Fees Records</h4>

                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>Student</th>
                                <th>Class</th>
                                <th>Required Fees</th>
                                <th>Amount Paid</th>
                                <th>Balance</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="feesTable">
                            <tr>
                                <td colspan="6" class="text-center text-muted">
                                    No records yet. Enter student details above.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>

    <!-- JavaScript -->
    <script>
         const feesForm = document.getElementById("feesForm");
        const feesTable = document.getElementById("feesTable");

        feesForm.addEventListener("submit", function(event) {
            event.preventDefault();

            // Get values from the form
            const studentName = document.getElementById("studentName").value.trim();
            const studentClass = document.getElementById("studentClass").value;
            const amountPaid = Number(document.getElementById("amountPaid").value);

            // Determine fees using if...else
            let requiredFees;

            if (studentClass === "O-Level") {
                requiredFees = 500000;
            } else if (studentClass === "A-Level") {
                requiredFees = 1000000;
            } else {
                alert("Please select a valid class level.");
                return;
            }

            // Validate payment
            if (amountPaid < 0 || !Number.isFinite(amountPaid)) {
                alert("Please enter a valid payment amount.");
                return;
            }

            // Calculate balance
            const balance = requiredFees - amountPaid;

            // Determine payment status
            let status;

            if (balance > 0) {
                status = "Balance Due";
            } else if (balance === 0) {
                status = "Fully Paid";
            } else {
                status = "Overpaid";
            }

            // Format amounts in Ugandan shillings
            const formatUGX = (amount) =>
                "UGX " + amount.toLocaleString("en-UG");

            // Remove the empty table message
            if (feesTable.querySelector("td[colspan='6']")) {
                feesTable.innerHTML = "";
            }

            // Create a new table row
            const row = document.createElement("tr");

            const values = [
                studentName,
                studentClass,
                formatUGX(requiredFees),
                formatUGX(amountPaid),
                formatUGX(Math.abs(balance)),
                status
            ];

            values.forEach(function(value) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            // Highlight the payment status
            const statusCell = row.lastElementChild;

            if (balance > 0) {
                statusCell.className = "text-danger fw-bold";
            } else if (balance === 0) {
                statusCell.className = "text-success fw-bold";
            } else {
                statusCell.className = "text-primary fw-bold";
            }

            // Add the row to the table
            feesTable.appendChild(row);

            // Reset the form
            feesForm.reset();

          
        });
    </script>

</body>
</html>
